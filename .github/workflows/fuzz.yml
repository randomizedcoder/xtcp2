# Go fuzzing (FP-7): every Fuzz* target in the module, found by
# `go test -list` in nix/scripts/fuzz-all.bash, so a new fuzzer is covered
# without editing this file.
#
#   fuzz-pr       every PR to main, 10 s per target
#   fuzz-nightly  daily and on demand, 2 min per target
#
# This is not a nix check: a derivation is cached by its inputs, so a nightly
# `nix build` would not fuzz again, and crashers would stay in the sandbox.
# On failure the new testdata/fuzz/ files are uploaded; commit the crasher as
# a seed once the bug is fixed.
#
# Actions are pinned by commit SHA; the comment names the tag it was taken from.
name: fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target budget (Go duration)"
        default: "2m"
        required: true

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fuzz-pr:
    name: fuzz-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # About 50 targets at 10 s plus their instrumented builds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: fuzz-all
        env:
          FUZZTIME: 10s
          FUZZ_LOG_DIR: ${{ runner.temp }}/fuzz-logs
        run: nix develop -c fuzz-all
      - name: upload crashers and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-pr-crashers
          path: |
            **/testdata/fuzz/**
            ${{ runner.temp }}/fuzz-logs/
          if-no-files-found: ignore

  fuzz-nightly:
    name: fuzz-nightly
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # About 50 targets at 2 min each.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: fuzz-all
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
          FUZZ_LOG_DIR: ${{ runner.temp }}/fuzz-logs
        run: nix develop -c fuzz-all
      - name: upload crashers and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-nightly-crashers
          path: |
            **/testdata/fuzz/**
            ${{ runner.temp }}/fuzz-logs/
          if-no-files-found: ignore
