syntax = "proto3";

package xtcp.controller.v1;

option go_package = "github.com/randomizedcoder/xtcp2/gen/go/xtcp_controller";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// All inbound messages are validated by the controller application layer.
// IDs are bounded ASCII identifiers; address selectors are canonical host CIDRs.
// Limits, required fields and contextual constraints are in pkg/treatment/validate.go.
service AgentControlService {
  rpc CheckIn(CheckInRequest) returns (CheckInResponse);
  rpc GetDesiredState(GetDesiredStateRequest) returns (GetDesiredStateResponse);
  rpc WatchDesiredState(WatchDesiredStateRequest) returns (stream WatchDesiredStateResponse);
}

service OperatorService {
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);
  rpc Review(ReviewRequest) returns (ReviewResponse);
  rpc Control(ControlRequest) returns (ControlResponse);
  rpc Inspect(InspectRequest) returns (InspectResponse);
}

enum AssignmentMode {
  ASSIGNMENT_MODE_UNSPECIFIED = 0;
  ASSIGNMENT_MODE_TRIAL = 1;
  ASSIGNMENT_MODE_STABLE = 2;
  ASSIGNMENT_MODE_SUSPENDED = 3;
  ASSIGNMENT_MODE_RETIRED = 4;
}

enum ApplyStatus {
  APPLY_STATUS_UNSPECIFIED = 0;
  APPLY_STATUS_PENDING = 1;
  APPLY_STATUS_VERIFIED = 2;
  APPLY_STATUS_REMOVED = 3;
  APPLY_STATUS_EXPIRED = 4;
  APPLY_STATUS_FAILED = 5;
}

message TCPSettings {
  optional string congestion_control = 1;
  bool congestion_lock = 2;
  optional uint32 rto_min_ms = 3;
  optional uint32 initial_congestion_window = 4;
  optional uint32 initial_receive_window = 5;
  optional bool quick_ack = 6;
  optional bool ecn = 7;
}

message Treatment {
  string id = 1;
  uint64 revision = 2;
  string destination = 3;
  TCPSettings settings = 4;
  bool ecn_fabric_verified = 5;
}

message Assignment {
  string id = 1;
  string experiment_id = 2;
  Treatment treatment = 3;
  AssignmentMode mode = 4;
  google.protobuf.Timestamp lease_expires_at = 5;
  // Previous approved stable treatment, restored on trial expiry/rollback.
  Treatment predecessor = 6;
  // Increment only on an explicitly approved reactivation, not lease renewal.
  uint64 generation = 7;
}

message DesiredState {
  string agent_id = 1;
  uint64 revision = 2;
  bool suspended = 3;
  repeated Assignment assignments = 4;
  google.protobuf.Timestamp issued_at = 5;
}

message Capabilities {
  string boot_id = 1;
  string kernel_release = 2;
  repeated string congestion_algorithms = 3;
  bool simple_host_routing = 4;
  bool actuator_enabled = 5;
}

message ApplicationRecord {
  Assignment assignment = 1;
  uint64 desired_revision = 2;
  ApplyStatus status = 3;
  google.protobuf.Timestamp received_at = 4;
  google.protobuf.Timestamp attempted_at = 5;
  google.protobuf.Timestamp applied_at = 6;
  google.protobuf.Timestamp verified_at = 7;
  google.protobuf.Timestamp removed_at = 8;
  string error = 9;
  // Locally generated canonical netlink route body, never accepted from RPC.
  bytes installed_route = 10;
  string installed_boot_id = 11;
  bool expired_latched = 12;
}

message LocalState {
  DesiredState desired = 1;
  bool locally_suspended = 2;
  string suspension_reason = 3;
  repeated ApplicationRecord records = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CheckInRequest {
  string agent_id = 1;
  string location = 2;
  Capabilities capabilities = 3;
  uint64 desired_revision = 4;
  repeated ApplicationRecord records = 5;
  bool locally_suspended = 6;
}
message CheckInResponse { DesiredState desired = 1; }
message GetDesiredStateRequest { string agent_id = 1; }
message GetDesiredStateResponse { DesiredState desired = 1; }
message WatchDesiredStateRequest { string agent_id = 1; uint64 after_revision = 2; }
message WatchDesiredStateResponse { uint64 revision = 1; }

message HostEvidence {
  string agent_id = 1;
  uint64 sockets = 2;
  uint64 bytes_acked = 3;
  double goodput_bps = 4;
  double retransmission_ratio = 5;
  double rtt_p95_ms = 6;
  uint64 exposed_sockets = 7;
  bool collection_healthy = 8;
}

message Evidence {
  string id = 1;
  google.protobuf.Timestamp analyzed_at = 2;
  google.protobuf.Timestamp window_start = 3;
  google.protobuf.Timestamp window_end = 4;
  string query_version = 5;
  string enrichment_version = 6;
  repeated HostEvidence hosts = 7;
  // Content-addressed reference to the complete immutable analysis artifact.
  string artifact_sha256 = 8;
}

message ExperimentPolicy {
  google.protobuf.Duration minimum_observation = 1;
  google.protobuf.Duration maximum_phase = 2;
  uint64 minimum_sockets_per_host = 3;
  uint64 minimum_bytes_per_host = 4;
  uint32 minimum_treated_hosts = 5;
  double minimum_improvement = 6;
  double maximum_retransmission_increase = 7;
  double maximum_rtt_increase = 8;
  google.protobuf.Duration maximum_evidence_age = 9;
}

enum ExperimentStatus {
  EXPERIMENT_STATUS_UNSPECIFIED = 0;
  EXPERIMENT_STATUS_PROPOSED = 1;
  EXPERIMENT_STATUS_RUNNING = 2;
  EXPERIMENT_STATUS_PAUSED = 3;
  EXPERIMENT_STATUS_SUSPENDED = 4;
  EXPERIMENT_STATUS_COMPLETE = 5;
  EXPERIMENT_STATUS_RETIRED = 6;
  EXPERIMENT_STATUS_ROLLED_BACK = 7;
}

message Phase {
  uint32 target_hosts = 1;
  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp observation_started_at = 3;
  google.protobuf.Timestamp evaluated_at = 4;
  Evidence evidence = 5;
  string outcome = 6;
  string reviewer = 7;
  string reason = 8;
}

message Experiment {
  string id = 1;
  string location = 2;
  string hypothesis = 3;
  Treatment treatment = 4;
  ExperimentPolicy policy = 5;
  Evidence baseline = 6;
  repeated string cohort_order = 7;
  repeated Phase phases = 8;
  ExperimentStatus status = 9;
  uint64 revision = 10;
  google.protobuf.Timestamp proposed_at = 11;
  Evidence latest_evidence = 12;
  string latest_outcome = 13;
}

message ProposeRequest { Experiment experiment = 1; string request_id = 2; }
message ProposeResponse { Experiment experiment = 1; }
message AnalyzeRequest { string experiment_id = 1; uint64 expected_revision = 2; }
message AnalyzeResponse { Evidence evidence = 1; string outcome = 2; }
message ReviewRequest {
  string experiment_id = 1;
  uint64 expected_revision = 2;
  bool approve = 3;
  string reason = 4;
  string request_id = 5;
  // Initial review uses baseline; subsequent reviews require fresh evidence.
  Evidence evidence = 6;
}
message ReviewResponse { Experiment experiment = 1; }

enum ControlAction {
  CONTROL_ACTION_UNSPECIFIED = 0;
  CONTROL_ACTION_PAUSE = 1;
  CONTROL_ACTION_SUSPEND = 2;
  CONTROL_ACTION_RESUME = 3;
  CONTROL_ACTION_ROLLBACK = 4;
  CONTROL_ACTION_RETIRE = 5;
}
message ControlRequest {
  // Exactly one selector, or fleet=true, is required.
  string experiment_id = 1;
  string agent_id = 2;
  string location = 3;
  bool fleet = 4;
  ControlAction action = 5;
  string reason = 6;
  string request_id = 7;
}
message ControlResponse { uint32 affected_agents = 1; }
message InspectRequest { string experiment_id = 1; string agent_id = 2; }
message InspectResponse {
  repeated Experiment experiments = 1;
  repeated DesiredState desired = 2;
  repeated CheckInRequest observed = 3;
}
