# .golangci-quick.yml
#
# Tier 0 — fast feedback.
# Suitable for pre-commit and local iteration.
#
# Run:
#   lint-quick                  (inside nix develop)
#   nix build .#checks.golangci-lint-quick

version: "2"

run:
  # Was 60s, sized for the untagged build only. `build-tags` below adds seven
  # more files to the type-check — including destinations_s3parquet.go, which
  # drags in the whole parquet-go graph — and the old cap was exceeded before
  # the linters produced a single finding ("0 issues" + "Timeout exceeded").
  # This is a ceiling, not a target; the tier still returns in well under it.
  timeout: 180s
  modules-download-mode: vendor
  # Lint the build-tag-gated files too. Without this, golangci-lint only ever
  # sees the untagged build, so pkg/xtcp/destinations_{kafka,nats,nsq,valkey,
  # s3parquet}.go and pkg/xtcp/enrich_{asn,locality}.go — together a large
  # share of the package — are never linted by any tier. Enabling every tag at
  # once matches the `all` target in nix/tests/go-test-flavors.nix: the
  # registries key on distinct schemes/names, so the union compiles.
  build-tags:
    - dest_kafka
    - dest_nats
    - dest_nsq
    - dest_valkey
    - dest_s3parquet
    - enrich_asn
    - enrich_locality

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck

  settings:
    errcheck:
      # io.Closer / *os.File Close() are routinely unchecked; flagging them
      # here is noise. Closer-failure on a read-only handle is not actionable.
      # fmt.Fprintf/Fprintln are explicit-writer variants of fmt.Printf
      # whose err returns can't fail in practice for tty/stdout/stderr.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

    govet:
      enable-all: true
      disable:
        # Struct alignment suggestions are noisy and not bugs.
        - fieldalignment
        # err shadowing is idiomatic Go; matches the other tier configs.
        - shadow

    staticcheck:
      checks:
        - "all"
        # SA1019 = deprecated symbols. Allow during migration windows.
        - "-SA1019"
        # ST1003 (underscore / camelCase): protobuf-generated identifiers
        # and kernel-uapi-mirroring constants legitimately use names that
        # violate Go style. Disable globally; the comprehensive tier has a
        # more granular pkg/xtcpnl override.
        - "-ST1003"

  exclusions:
    warn-unused: true
    paths:
      # Skip generated code entirely (don't even type-check it).
      - ".*\\.pb\\.go$"
      - ".*\\.pb\\.gw\\.go$"
      - "^gen/"
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - unused
      # Kernel-version-tagged struct names (TCPInfo6_10_3, TCPInfo5_4_281, …)
      # mirror Linux kernel uapi `struct tcp_info` revisions. Renaming would
      # break the explicit per-version mapping that's the whole point of
      # pkg/xtcpnl. Allowed by design (gosrt SHA1-in-PBKDF2 precedent).
      - path: "pkg/xtcpnl/"
        linters:
          - staticcheck
        text: "ST1003: should not use underscores in Go names; (struct field|const) TCPInfo[0-9_]+(_Size(Cst)?)?"

issues:
  # golangci-lint defaults to max-issues-per-linter: 50 and max-same-issues: 3,
  # which silently truncates the report. That is not a cosmetic difference for
  # a fix-list: the 2026-09-23 misspell sweep was scoped from a reported "19
  # issues" when the true count was 35 — every `behaviour` past the third was
  # hidden, in files the capped output never named. A run whose output is the
  # work queue has to show all of it.
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
