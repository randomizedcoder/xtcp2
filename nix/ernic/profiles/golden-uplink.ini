# golden-uplink: the golden-record VM's ionic NICs (docs/design-rocm-ernic-nics.md).
# Fixed identity and speed, so the uplink columns are the same on every
# capture; two Ethernet queues for the VM's two vCPUs. Not calibrated
# against any real product.

[identity]
fw_version = xtcp2-golden-1.0

[link]
speed_mbps = 100000

[queues]
eth = 2
intr_vectors = auto
