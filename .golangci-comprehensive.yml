# .golangci-comprehensive.yml
#
# Tier 2 — Comprehensive lint (~10 minutes). Nightly only.
#
# Surfaces complexity, duplication, allocation, and exhaustiveness findings on
# top of Tier 1. Findings here become merge-gating once the team accepts them.
#
# Run:
#   lint-comprehensive            (inside nix develop)
#   nix build .#checks.golangci-lint-comprehensive

version: "2"

run:
  timeout: 15m
  modules-download-mode: vendor
  # Lint the build-tag-gated files too. Without this, golangci-lint only ever
  # sees the untagged build, so pkg/xtcp/destinations_{kafka,nats,nsq,valkey,
  # s3parquet}.go and pkg/xtcp/enrich_{asn,locality}.go — together a large
  # share of the package — are never linted by any tier. Enabling every tag at
  # once matches the `all` target in nix/tests/go-test-flavors.nix: the
  # registries key on distinct schemes/names, so the union compiles.
  build-tags:
    - dest_kafka
    - dest_nats
    - dest_nsq
    - dest_valkey
    - dest_s3parquet
    - enrich_asn
    - enrich_locality

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Tier 0
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
    # Tier 1
    - gosec
    - gocritic
    - revive
    - noctx
    - contextcheck
    - durationcheck
    # Tier 2 additions
    - exhaustive
    - prealloc
    - gocyclo
    - funlen
    - goconst
    - dupl
    - unconvert
    - nakedret
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        # fmt.Fprintf/Fprintln to stdout/stderr writers can't fail in
        # practice (writes to *os.File-backed tty fail only on EBADF or
        # disk-full for regular files, neither of which we recover from).
        # The runMain refactors made these explicit instead of fmt.Printf
        # so checking the err here adds noise without protecting against
        # a real failure mode.
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

    govet:
      enable-all: true
      disable:
        - fieldalignment
        # err shadowing is idiomatic Go; disable the shadow check rather
        # than rewriting many sites. See .golangci.yml for context.
        - shadow

    staticcheck:
      checks:
        - "all"
        - "-SA1019"

    gosec:
      excludes:
        - G103
        - G115
        - G204
        - G304

    gocritic:
      enabled-checks:
        - appendAssign
        - argOrder
        - badCond
        - builtinShadow
        - dupCase
        - dupSubExpr
        - nilValReturn
        - rangeValCopy
        - sliceClear
      disabled-checks:
        - hugeParam

    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-declaration

    gocyclo:
      min-complexity: 30

    funlen:
      # defineFlags() and envOverrideMarshalAndDest() are legitimately long but
      # entirely linear (a flat list of flag definitions / env overrides, no
      # branching or nesting) — splitting them into helpers hurts readability
      # more than it helps, so allow a slightly higher budget (defineFlags is
      # ~65 statements, envOverrideMarshalAndDest ~69, both flat).
      lines: 120
      statements: 70

    goconst:
      min-len: 3
      min-occurrences: 3
      # The repeated literals it would otherwise flag (destStdout, docker,
      # ESTABLISHED/LISTEN, …) are duplicated only across TEST files (one
      # production use each). Tests should assert literals independently rather
      # than import the code's constants, so scope goconst to non-test code.
      ignore-tests: true

    dupl:
      threshold: 150

    nakedret:
      max-func-lines: 30

    # Same locale as Tier 1, which is where misspell now gates. Kept enabled
    # here so a comprehensive run stays a superset of the standard one.
    misspell:
      locale: US

    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    warn-unused: true
    paths:
      # Skip generated code entirely (don't even type-check it).
      - ".*\\.pb\\.go$"
      - ".*\\.pb\\.gw\\.go$"
      - "^gen/"
    rules:
      - path: "_test\\.go"
        linters:
          - dupl
          - funlen
          - gocyclo
          - errcheck
          - unused
          - goconst
          - noctx
      # G404 (math/rand) and G301 (dir perms) in tests, as in .golangci.yml.
      #
      # G302 (chmod perms) is here for a sharper reason than either: its
      # expectation cannot be met by a directory at all. It compares the mode
      # against 0600 as a bitmask, so ANY mode carrying the execute bit is a
      # finding — and a directory without the execute bit cannot be traversed.
      # pkg/listener and pkg/ipasn strip a directory's write bit (0o500) so
      # that os.Remove inside it fails with EACCES, which is the only way to
      # reach the unlink errors this phase stopped discarding; 0o500 is
      # strictly more restrictive than the 0600 the rule asks for, and the
      # restore to 0o700 is what lets t.TempDir clean up.
      #
      # The standalone gosec check never sees these: it defaults to
      # -tests=false, so no equivalent belongs in its global -exclude list.
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G404|G301|G302"
      # Kernel-version-tagged names (TCPInfo6_10_3, TCPInfo5_4_281, …) mirror
      # Linux kernel uapi `struct tcp_info` revisions; renaming would defeat
      # the per-version mapping that is the point of pkg/xtcpnl.
      - path: "pkg/xtcpnl/"
        linters:
          - staticcheck
        text: "ST1003: should not use underscores in Go names; (struct field|const) TCPInfo[0-9_]+(_Size(Cst)?)?"
      # Per-attribute parser files in pkg/xtcpnl deliberately mirror the
      # 1:1 Linux kernel INET_DIAG_* → Go-struct mapping. Keeping them as
      # separate files (tos vs tclass, the multiple tcpinfo size variants)
      # is a maintenance feature, not duplication waiting to be deduped.
      - path: "pkg/xtcpnl/"
        linters:
          - dupl
      # The dest Send() methods share shape but each tracks its own
      # prometheus metric prefix (destUDP vs destUnixGram) + xio.Op
      # constant. Factoring out the common spine would force callers
      # to thread the labels through and would couple the io_uring +
      # syscall paths together — not worth the code-shape match.
      - path: "pkg/xtcp/destinations_(udp|unixgram)\\.go"
        linters:
          - dupl
      # tools/ analyzers are short utilities; complexity/duplication limits don't apply.
      - path: "tools/"
        linters:
          - funlen
          - gocyclo
          - dupl
          # tools/{metrics,quality-report,…} legitimately use linter and
          # rule names ("govet", "errcheck", "G103") as bare literals
          # since those ARE the canonical identifiers. Lifting to consts
          # would obscure rather than clarify.
          - goconst
      # The next five are verbatim-upstream-spelling rules. The first two were
      # once copies of rules already carried by .golangci.yml that had never
      # been ported here, which is why this tier reported three misspellings the
      # gating tier did not. Keep the three configs' misspell rules in step;
      # .golangci-quick.yml does not enable misspell at all, so it carries none
      # of them, and that is the only legitimate difference between the three.
      #
      # `ifa_prefered` is how the Linux kernel spells it. The comment it appears
      # in is a verbatim quotation of `struct ifa_cacheinfo` from
      # include/uapi/linux/if_addr.h, and the value of those comments is that
      # they diff against the kernel tree — so correcting the spelling would
      # make the comment wrong about the thing it documents. Scoped to the one
      # word in the one file rather than added to misspell's ignore list, so a
      # genuine "prefered" anywhere else still fails.
      - path: "pkg/xtcpnl/xtcpnl_ifaddrmsg\\.go"
        linters:
          - misspell
        text: "`prefered` is a misspelling of `preferred`"
      # `neighbour` is a command name a user types, not prose. iproute2's object
      # table carries both `neighbor` and `neighbour` (ip/ip.c:93-94), and
      # `matches()` is prefix matching, not fuzzy matching — "neighbour" is not
      # a prefix of "neighbor", so dropping the second entry makes `goip
      # neighbour show` report an unknown object where `ip` works.
      # internal/goip/dispatch.go holds the alias itself, dispatch_test.go
      # names the pair in the comment on the row that asserts their order, and
      # obj_neigh_test.go runs the alias end to end — that row's argv is the
      # string a user types, so it cannot be respelled without testing a
      # command that does not exist. Prose in those files is still checked, by
      # the audit named in the next entry: the exemption there covers only a
      # quoted command token.
      - path: "internal/goip/(dispatch(_test)?|obj_neigh_test)\\.go"
        linters:
          - misspell
        text: "`neighbour` is a misspelling of `neighbor`"
      # The ten files below cite kernel paths that contain the word.
      # net/core/neighbour.c and include/uapi/linux/neighbour.h are the real
      # file names, so "correcting" them produces paths that do not exist and
      # breaks the one thing those comments are for, which is diffing against a
      # kernel tree. Sixteen occurrences across the ten; misspell reports
      # thirteen, skipping the two inside torvalds/linux URLs, and the
      # sixteenth is in obj_neigh_test.go, covered by the entry above.
      #
      # On its own this entry would be exactly the suppression the policy
      # forbids. An exclusion can only match misspell's MESSAGE, which is
      # identical whether the word sits inside a kernel path or inside British
      # prose, so widening to ten whole files does give up real coverage inside
      # them. What replaces it is tools/kernel-citation-audit, a check that
      # fails unless every occurrence in the tree is directly preceded by
      # `net/core/` or `linux/`. That is strictly stronger than what misspell
      # was giving: misspell is satisfied by `net/core/neighbor.c` and the audit
      # is not, so it also catches a kernel path "fixed" by someone running
      # lint-fix.
      #
      # obj_neigh.go and obj_neigh_test.go are listed in two different entries
      # deliberately. The first holds only a citation; the second also holds the
      # argv a user types. A collapsed `obj_neigh(_test)?\.go` would match the
      # same two files and lose the reason.
      - path: "(internal/goip/obj_neigh|internal/goip/render/neigh_test|internal/goip/req/req|internal/goipparity/commands|pkg/nlparity/nlparity_(names|segment)_test|pkg/xtcpnl/xtcpnl_(ndmsg|rtnetlink_requests)(_test)?)\\.go"
        linters:
          - misspell
        text: "`neighbour` is a misspelling of `neighbor`"
      # The audit tool itself, which cannot be written without using the word in
      # prose: its documentation, its exemption reasons and its fixtures are all
      # about that word. It is also the one directory the audit skips, for the
      # same reason, with the argument spelled out at its selfDirCst. The
      # alternative was to assemble the constant from fragments so neither tool
      # could see it, which hides the word without making anything more correct
      # and leaves the file a reader consults for the rule unable to state it.
      #
      # The text is matched case-insensitively here and nowhere else: the
      # fixtures deliberately include `Neighbour` and `NEIGHBOUR`, because the
      # audit has to be case-insensitive and a test that only ever passes the
      # lowercase form would not show that. The ten citation files above keep
      # the exact lowercase text, which is all they contain.
      - path: "tools/kernel-citation-audit/"
        linters:
          - misspell
        text: "(?i)`neighbour` is a misspelling of `neighbor`"
      # "DORMANT" appears three times in render.go because it is a member of
      # three *different* kernel enums, each transcribed as its own table with
      # its own ip/ipaddress.c citation: IF_OPER_DORMANT in operStates
      # (:120-123), IF_LINK_MODE_DORMANT in linkModes (:170-172), and
      # IFF_DORMANT in linkFlagNames (:94-111). Hoisting them to one constant
      # would assert the three are the same value, which is what makes this
      # finding wrong rather than merely inconvenient.
      #
      # Unlike the "default" case below, three NAMED constants are not the
      # better answer here: all three sites are rows of a table literal
      # (`[...]string{...}` twice, a slice of structs once), so a constant in
      # one row and bare strings in its neighbors would read worse than either
      # alternative. (An earlier version of this comment claimed three
      # constants "would not satisfy goconst anyway" — that is false. goconst
      # ignores literals inside a const declaration; verified against
      # golangci-lint with min-occurrences 3.)
      #
      # Scoped to the one word in the one file, so a genuine repeated literal
      # elsewhere in internal/goip still fails.
      - path: "internal/goip/render/render\\.go"
        linters:
          - goconst
        text: "string `DORMANT` has 3 occurrences"
      # There is deliberately NO rule here for "default", which internal/goip/
      # render also spells three times. goconst does not see literals inside a
      # const declaration, so two of the three became named constants —
      # groupZeroName (render.go) and routePrefixWildcard (route.go) — which
      # says at the call site what an exclusion here could only say in the
      # config. The third is a row of the routeTableNames map, left as a
      # literal so it reads like its two siblings, and one occurrence is under
      # min-occurrences. Prefer that shape over a new exclusion.
      - linters:
          - staticcheck
        text: "ST1003:"
      - linters:
          - staticcheck
        text: "SA9003:"

issues:
  # golangci-lint defaults to max-issues-per-linter: 50 and max-same-issues: 3,
  # which silently truncates the report. That is not a cosmetic difference for
  # a fix-list: the 2026-09-23 misspell sweep was scoped from a reported "19
  # issues" when the true count was 35 — every `behaviour` past the third was
  # hidden, in files the capped output never named. A run whose output is the
  # work queue has to show all of it.
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
